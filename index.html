<!DOCTYPE html>
<html>
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PA2</title>
    <style>
    body {
        background-color: #EEEEEE;
        display: flex;
        align-items: center; 
        justify-content: center; 
    }

    #container {
        display: flex; 
    }

    #canvas-holder {
        flex: 1;
    }

    #inputs {
        flex: 1; 
        margin-left: 20px; 
    }

    .input-text {
        width: 100px;
        height: 20px;
        padding: 3px;
        font-size: 14px;
    }

    .button-item {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .button {
        width: 90px;
        height: 28px;
        font-size: 13px;
        border-radius: 5px;
        cursor: pointer;
        transition: all .5s;
        background-color: white;
    }

    .button:hover {
        background-color: rgb(216, 216, 216);
    }

    .button-hint {
        margin: 0;
        color: red;
    }
    </style>

<script src="Utils/trackball-rotator.js"></script>
<script src="Utils/m4.js"></script>
<script src="StereoCamera.js"></script>
<script src="Model.js"></script>
<script src="SensorHandler.js"></script>
<script src="shader.gpu"></script>
<script src="main.js"></script>
</head>

<body onload="init()">
    <div id="container">
        <div id="canvas-holder">
            <canvas width="380" height="260" id="webglcanvas" style="background-color:red"></canvas>
        </div>
        <div id="inputs">
                <h2>Virich Cyclic Surface</h2>
                <p id="message">Drag your mouse on the figure to rotate it.<br>
                (On a touch screen, you can use your finger.)</p>
            <div>
                <label for="eyeSeparation">Eye separation parameter:</label>
                <input id="eyeSeparation" name="eyeSeparation" type="range" min="0.1" max="2.0" step="0.1" value="0.7">
            </div>
            <div>
                <label for="fieldOfView">Field of View angle:</label>
                <input id="fieldOfView" name="fieldOfView" type="range" min="0.1" max="1.0" step="0.05" value="0.4">
            </div>
            <div>
                <label for="nearClipping">Near Clipping distance:</label>
                <input id="nearClipping" name="nearClipping" type="range" min="1.0" max="10.0" step="0.5" value="8.0">
            </div>
            <div>
                <label for="convergence">Convergence distance:</label>
                <input id="convergence" name="convergence" type="range" min="5.0" max="20.0" step="0.5" value="14.0">
            </div>
            <div class="input-button-row">
                <label for="serverIP">Sensor Server IP:</label>
                    <input class="input-text" id="serverIP" name="serverIP" type="text" value=" 192.168.0.103">
                    <button class="button" id="connectBtn"><p class="button-hint" id="connectionStatus">Disconnected</p></button>
            </div>
        </div>
    </div>
</body>
</html>
