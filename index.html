<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>PA1</title>
  <style>
    body {
      background-color: #EEEEEE;
      display: flex;
      align-items: center; 
      justify-content: center; 
    }

    #container {
      display: flex; 
    }

    #canvas-holder {
      flex: 1;
    }

    #inputs {
      flex: 1; 
      margin-left: 20px; 
    }
  </style>

  <script src="./Utils/trackball-rotator.js"></script>
  <script src="./Utils/m4.js"></script>
  <script src="./shader.gpu"></script>
  <script src="./main.js"></script>
  <script src="./constants.js"></script>
</head>
<body onload="init()">
  <div id="container">
    <div id="canvas-holder">
      <canvas width="360" height="240" id="webglcanvas" style="background-color:red"></canvas>
    </div>


    <div id="inputs">
        <h2>Virich Cyclic Surface</h2>
        <p id="message">Drag your mouse on the figure to rotate it.<br>
        (On a touch screen, you can use your finger.)</p>

      <label for="eyeSeparation">Eye Separation:</label>
      <input id="eyeSeparation" value="70" type="range" min="0" max="200" step="2" onchange="reDraw()" />
      <br>
      <label for="fieldOfView">Field Of View angle:</label>
      <input id="fieldOfView" value="0.8" type="range" min="0.01" max="3.14" step="0.01" onchange="reDraw()" />
      <br>
      <label for="nearClipping">Near Clipping distance:</label>
      <input id="nearClipping" value="4.9" type="range" min="0" max="10" step="0.5" onchange="reDraw()" />
      <br>
      <label for="Convergence">Convergence distance:</label>
      <input id="Convergence" value="2000" type="range" min="100" max="3000" step="100" onchange="reDraw()" />
      <br>
    </div>
  </div>

</body>
</html>
